name: Build Test Image

# 触发条件：当 Dockerfile 或这个 workflow 文件本身被推送到 main 分支时触发
on:
  push:
    branches: [main]
    paths:
      - 'Dockerfile'
      - '.github/workflows/buildimage.yml'

# 必须设置这个权限，否则无法推送到 GitHub 的镜像仓库 (GHCR)
permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # 1. 拉取你的仓库代码
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. 登录 GitHub 容器镜像仓库 (GHCR)
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 3. 构建并推送镜像
      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          # 镜像地址，会自动转成全小写
          tags: ghcr.io/${{ github.repository }}/robot-ci:humble-v1
